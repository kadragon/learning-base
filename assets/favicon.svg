<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Symbol Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); rx: 16px; }
    .symbol { fill: none; stroke: url(#accent-grad); stroke-linecap: round; stroke-linejoin: round; }
    .sparkle { fill: #F43F5E; }
    @media (prefers-color-scheme: light) {
      .bg-ring { stroke: rgba(0, 0, 0, 0.1); stroke-width: 1px; }
    }
  </style>

  <!-- Background Rounded Rect -->
  <rect class="bg" width="64" height="64" rx="16" />
  <rect class="bg-ring" width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Learning Book / Base Shape -->
  <!-- Left page & right page forming open book base -->
  <path class="symbol" stroke-width="3.5" filter="url(#glow)"
        d="M 16 42 Q 24 38 32 42 Q 40 38 48 42 L 48 24 Q 40 20 32 24 Q 24 20 16 24 Z" />
  <path class="symbol" stroke-width="3.5" d="M 32 24 L 32 42" />

  <!-- Code brackets floating above the book -->
  <path class="symbol" stroke-width="3.5" filter="url(#glow)"
        d="M 23 16 L 18 20 L 23 24" />
  <path class="symbol" stroke-width="3.5" filter="url(#glow)"
        d="M 41 16 L 46 20 L 41 24" />

  <!-- Sparkle of insight / learning -->
  <path class="sparkle" filter="url(#glow)"
        d="M 32 12 Q 32 16 30 16 Q 32 16 32 20 Q 32 16 34 16 Q 32 16 32 12 Z" />
</svg>
